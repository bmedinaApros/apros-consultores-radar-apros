name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: postgres_ci
      TEST_DATABASE_URL: postgres://radar_app:radar_app_dev@localhost:5432/radar_test
      TEST_MIGRATE_DATABASE_URL: postgres://radar_owner:radar_dev@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar roles y base de pruebas
        run: psql -h localhost -U postgres -f docker/init-roles.sql
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://radar_app:radar_app_dev@localhost:5432/radar_test
          SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      - name: Auditoría de dependencias (falla ante alta o crítica)
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Escaneo de secretos (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
