# Desarrollo local: solo la base de datos. La aplicación se corre con `npm run dev` en tu Mac.
# Las credenciales de aquí son de desarrollo y no deben usarse en ningún otro entorno.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - radar-db:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  radar-db:
